[project]
name = "fusion-bip-mcp-server"
version = "0.1.0"
description = "An MCP server that exposes Oracle Fusion BI Publisher operations (read-only SQL queries) as tools an AI agent can call, directly over BIP SOAP."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["mcp>=2.0.0", "keyring>=24"]

[project.scripts]
fusion-mcp = "fusion_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_mcp"]
